<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Mind Left Body Game</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BBKEDMF3F1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BBKEDMF3F1');
  </script>

  <style>
    /* Sit above the fixed background photo layers from styles.css */
    .lb-header,
    .lb-container {
      position: relative;
      z-index: 1;
    }

    .lb-header {
      padding: 20px 16px 0;
      text-align: center;
      cursor: pointer;
    }

    .lb-title {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--mlb-primary);
    }

    .nav-links {
      margin-top: 12px;
    }

    .nav-links a {
      color: var(--mlb-primary);
      text-decoration: none;
      margin: 0 12px;
      font-weight: 600;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .lb-container {
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
    }

    /* Same look as the home-page leaderboard panel */
    .panel.lb-panel {
      background: rgba(139, 157, 175, 0.4);
      backdrop-filter: blur(8px) saturate(1.1);
      -webkit-backdrop-filter: blur(8px) saturate(1.1);
    }

    .panel.lb-panel .panel-head {
      padding: 10px 16px;
    }

    .panel.lb-panel .tab-title {
      color: #444;
      font-size: 18px;
      font-weight: 600;
    }

    .panel.lb-panel .panel-body {
      padding: 0;
    }

    .lb-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 32px minmax(140px, 200px) 1fr auto;
      grid-template-areas: "rank main last points";
      align-items: center;
      column-gap: 16px;
      padding: 8px 16px;
      line-height: 1.3;
      border-bottom: 1px solid var(--mlb-border-subtle);
    }

    .lb-row:last-child {
      border-bottom: none;
    }

    .lb-rank {
      grid-area: rank;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #444;
    }

    .lb-main {
      grid-area: main;
      min-width: 0;
    }

    .lb-name {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      overflow-wrap: anywhere;
    }

    .lb-stats {
      font-size: 13px;
      color: #374151;
    }

    .lb-last {
      grid-area: last;
      min-width: 0;
      font-size: 14px;
      color: #1f2937;
    }

    .lb-last-label {
      font-weight: 600;
    }

    .lb-last a {
      color: #1e3a5f;
      font-weight: 600;
    }

    .lb-points {
      grid-area: points;
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }

    .lb-message {
      padding: 24px 16px;
      text-align: center;
      color: #374151;
    }

    @media (max-width: 768px) {
      .lb-title {
        font-size: 26px;
      }

      .lb-container {
        margin: 16px auto;
      }

      .lb-row {
        grid-template-columns: 28px 1fr auto;
        grid-template-areas:
          "rank main points"
          ".    last last";
        column-gap: 8px;
        row-gap: 2px;
        padding: 7px 12px;
      }
    }
  </style>
</head>
<body>
  <header class="lb-header">
    <h1 class="lb-title">Mind Left Body Game</h1>
    <h2 class="lb-title">Leaderboard</h2>
    <nav class="nav-links">
      <a href="/">Play Game</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </header>

  <main class="lb-container">
    <section class="panel lb-panel">
      <div class="panel-head"><div class="tab-title">Top Players (All-Time)</div></div>
      <div class="panel-body" id="leaderboardContent">
        <div class="lb-message">Loading leaderboard...</div>
      </div>
    </section>
  </main>

  <script>
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function formatShowDate(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
      if (!m) return iso || '';
      return `${MONTHS[parseInt(m[2], 10) - 1]} ${parseInt(m[3], 10)}, ${m[1]}`;
    }

    function cleanSong(song) {
      return String(song || '')
        .replace(/\.(mp3|flac|shn|ogg|wav)$/i, '')
        .replace(/^\d{1,3}[\s._-]+/, '')
        .trim();
    }

    function cleanShowTitle(title) {
      return String(title || '').replace(/\s+on\s+\d{4}-\d{2}-\d{2}\s*$/i, '').trim();
    }

    function formatLastPlayed(ts) {
      const d = ts ? new Date(ts) : null;
      if (!d || isNaN(d)) return '';
      return `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`;
    }

    function renderLastCorrect(lc) {
      if (!lc) return '';
      const show = cleanShowTitle(lc.showTitle) || 'Show';
      const showHtml = lc.showId
        ? `<a href="https://archive.org/details/${encodeURIComponent(lc.showId)}" target="_blank" rel="noopener noreferrer">${escapeHtml(show)}</a>`
        : escapeHtml(show);
      const date = lc.showDate ? `, ${escapeHtml(formatShowDate(lc.showDate))}` : '';
      return `<span class="lb-last-label">Last win:</span> ${escapeHtml(cleanSong(lc.song))} &mdash; ${showHtml}${date}`;
    }

    async function loadLeaderboard() {
      const contentEl = document.getElementById('leaderboardContent');

      try {
        const response = await fetch('/api/leaderboard');
        const data = await response.json();
        const rows = data.leaderboard || [];

        if (!rows.length) {
          contentEl.innerHTML = '<div class="lb-message">No scores yet. Be the first to play!</div>';
          return;
        }

        contentEl.innerHTML = '<ol class="lb-list">' + rows.map((player, i) => {
          const points = player.points || 0;
          const rounds = player.games || 0;
          const avg = rounds > 0 ? (points / rounds).toFixed(2) : '0.00';
          const lastPlayed = formatLastPlayed(player.lastPlayed);
          return `
            <li class="lb-row">
              <div class="lb-rank">${i + 1}</div>
              <div class="lb-main">
                <div class="lb-name">${escapeHtml(player.username)}</div>
                <div class="lb-stats">${rounds.toLocaleString()} rounds &bull; ${avg} pts/round${lastPlayed ? ` &bull; ${lastPlayed} last play` : ''}</div>
              </div>
              <div class="lb-last">${renderLastCorrect(player.lastCorrect)}</div>
              <div class="lb-points">${points.toLocaleString()}</div>
            </li>`;
        }).join('') + '</ol>';
      } catch (error) {
        console.error('Failed to load leaderboard:', error);
        contentEl.innerHTML = '<div class="lb-message">Could not load leaderboard. Please try again later.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadLeaderboard);

    document.querySelector('.lb-header').addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      window.location.href = '/';
    });
  </script>
</body>
</html>
